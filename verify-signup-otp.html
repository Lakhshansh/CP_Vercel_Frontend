<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Your Email - Multi Therapy Management System</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .otp-wrapper {
      min-height: calc(100vh - 120px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .otp-card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 22px;
      padding: 36px 32px;
      box-shadow: 0 15px 45px rgba(15, 23, 42, .12);
    }

    .otp-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      background: #eaf2ff;
      color: #0d6efd;
    }

    .otp-card h2 {
      text-align: center;
      font-weight: 700;
      color: #162033;
      margin-bottom: 8px;
      font-size: 26px;
    }

    .otp-subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .otp-section {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      background: #f8fafc;
    }

    .otp-section h5 {
      margin-bottom: 6px;
      color: #172033;
      font-weight: 700;
      font-size: 16px;
    }

    .otp-section small {
      color: #6b7280;
      display: block;
      margin-bottom: 12px;
      font-size: 13.5px;
    }

    .otp-input {
      width: 100%;
      text-align: center;
      letter-spacing: 12px;
      font-size: 26px;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      transition: all 0.2s ease;
    }

    .otp-input:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, .12);
      outline: none;
    }

    .btn-verify {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      background: #0d6efd;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-verify:hover {
      background: #0b5ed7;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(13, 110, 253, 0.35);
    }

    .btn-resend {
      width: 100%;
      margin-top: 12px;
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      font-size: 15px;
      background: #ffffff;
      border: 2px solid #0d6efd;
      color: #0d6efd;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .btn-resend:hover {
      background: #0d6efd;
      color: #ffffff;
    }

    .otp-note {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 18px;
      margin-bottom: 0;
    }

    .top-flash-banner {
      background: #d1e7dd;
      color: #0f5132;
      border-bottom: 1px solid #badbcc;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 500;
      text-align: left;
    }
  </style>
</head>
<body>
  <!-- Top Flash Notification Banner -->
  <div id="topFlashBanner" class="top-flash-banner" hidden>
    OTP sent to your email.
  </div>

  <nav class="mt-navbar">
    <div class="container-fluid mt-navbar-inner">
      <a class="mt-brand" href="./index.html">
        <img src="./images/logo.png" alt="Multi Therapy Management System Logo" class="mt-logo">
        <div>
          <div class="mt-brand-title">Multi Therapy Management System</div>
          <div class="mt-brand-subtitle">Care • Support • Progress • Together</div>
        </div>
      </a>
    </div>
  </nav>

  <div class="otp-wrapper">
    <div class="otp-card">
      <div class="otp-icon">📧</div>
      <h2>Verify Your Email</h2>
      <p class="otp-subtitle">
        A 6-digit OTP has been sent to your email address.
      </p>

      <div id="otpAlert" class="alert mb-3" hidden></div>
      <div id="demoOtpBanner" class="alert alert-warning mb-3" style="font-size: 13.5px;" hidden></div>

      <form id="verifyOtpForm">
        <div class="otp-section">
          <h5>✉️ Email OTP</h5>
          <small>Code sent to <strong id="userEmailText">your registered email</strong></small>
          <input
            type="text"
            id="emailOtpInput"
            name="email_otp"
            class="otp-input"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            pattern="[0-9]{6}"
            placeholder="0 0 0 0 0 0"
            required
            autofocus
          >
        </div>

        <button type="submit" id="btnVerify" class="btn-verify">
          ✅ Verify &amp; Create Account
        </button>
      </form>

      <button type="button" id="btnResend" class="btn-resend">
        🔄 Resend OTP
      </button>

      <p class="otp-note">
        OTP is valid for 5 minutes. Never share your OTP with anyone.
      </p>

      <a href="./index.html" style="display: block; text-align: center; margin-top: 14px; color: #0d6efd; text-decoration: none; font-size: 14px;">
        ← Back to Login
      </a>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script src="./js/verify-signup-otp.js"></script>
</body>
</html>
