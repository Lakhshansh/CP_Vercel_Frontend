<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="docCircleClip">
      <circle cx="50" cy="50" r="47"/>
    </clipPath>
    <linearGradient id="docBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>

  <!-- Circular Light Green Background with Clean White Border -->
  <circle cx="50" cy="50" r="48" fill="url(#docBgGrad)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="50" cy="50" r="46.5" fill="none" stroke="#a7f3d0" stroke-width="1.2"/>

  <!-- Doctor Illustration Clamped to Circle -->
  <g clip-path="url(#docCircleClip)">
    <!-- Doctor Body / Lab Coat (White & Professional) -->
    <path d="M22 86 C22 62 34 54 50 54 C66 54 78 62 78 86 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    
    <!-- Medical Inner Scrubs / Shirt (Teal Green #078B69) -->
    <path d="M42 54 L50 67 L58 54 Z" fill="#078B69"/>
    
    <!-- Stethoscope Tube & Chestpiece -->
    <path d="M39 55 C39 67 44 73 50 73 C56 73 61 67 61 55" stroke="#1e293b" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="75" r="3.5" fill="#94a3b8" stroke="#0f172a" stroke-width="1.4"/>
    
    <!-- Lab Coat Lapels & Seams -->
    <path d="M34 56 L45 75 L38 86" stroke="#078B69" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M66 56 L55 75 L62 86" stroke="#078B69" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    
    <!-- Medical Cross Badge on Pocket -->
    <rect x="64" y="65" width="2.5" height="7.5" rx="1.2" fill="#059669"/>
    <rect x="61.5" y="67.5" width="7.5" height="2.5" rx="1.2" fill="#059669"/>

    <!-- Doctor Neck -->
    <rect x="45" y="44" width="10" height="12" fill="#fed7aa" rx="2"/>

    <!-- Doctor Head / Face (Warm Skin Tone) -->
    <circle cx="50" cy="33" r="14" fill="#fed7aa"/>

    <!-- Doctor Professional Styled Dark Hair -->
    <path d="M35 31 C35 17 43 15 50 15 C57 15 65 17 65 31 C60 24 55 23 50 23 C44 23 39 25 35 31 Z" fill="#1e293b"/>
    <!-- Side Hair Trim -->
    <path d="M35 29 L35 34 C36 34 37 32 37 29 Z" fill="#1e293b"/>
    <path d="M65 29 L65 34 C64 34 63 32 63 29 Z" fill="#1e293b"/>

    <!-- Doctor Eyebrows -->
    <path d="M41 27 Q44 26 47 27" stroke="#1e293b" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M53 27 Q56 26 59 27" stroke="#1e293b" stroke-width="1.4" stroke-linecap="round" fill="none"/>

    <!-- Doctor Eyes -->
    <circle cx="44.5" cy="32.5" r="1.6" fill="#0f172a"/>
    <circle cx="55.5" cy="32.5" r="1.6" fill="#0f172a"/>
    <circle cx="44" cy="32" r="0.5" fill="#ffffff"/>
    <circle cx="55" cy="32" r="0.5" fill="#ffffff"/>

    <!-- Doctor Eyeglasses (Modern Professional Frames) -->
    <rect x="39.5" y="29" width="9" height="7" rx="2.5" stroke="#059669" stroke-width="1.4" fill="none"/>
    <rect x="51.5" y="29" width="9" height="7" rx="2.5" stroke="#059669" stroke-width="1.4" fill="none"/>
    <line x1="48.5" y1="32" x2="51.5" y2="32" stroke="#059669" stroke-width="1.4"/>
    <line x1="36" y1="31" x2="39.5" y2="31" stroke="#059669" stroke-width="1.2"/>
    <line x1="60.5" y1="31" x2="64" y2="31" stroke="#059669" stroke-width="1.2"/>

    <!-- Doctor Nose -->
    <path d="M49 34 L49.5 37 L51 37" stroke="#ea580c" stroke-width="1.1" stroke-linecap="round" fill="none"/>

    <!-- Doctor Warm Friendly Smile -->
    <path d="M46.5 39.5 Q50 43 53.5 39.5" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>

