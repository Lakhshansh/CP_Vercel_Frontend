<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="shadowLeg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="260" rx="20" fill="url(#legGrad)"/>
  
  <!-- Subtle floor line / Mat -->
  <rect x="30" y="195" width="340" height="12" rx="6" fill="#BFDBFE" opacity="0.6"/>

  <!-- Character performing straight leg raise on mat -->
  <g filter="url(#shadowLeg)" transform="translate(60, 45)">
    <!-- Head resting on mat -->
    <circle cx="50" cy="140" r="18" fill="#103463"/>
    
    <!-- Torso lying horizontal on mat -->
    <path d="M 66 142 L 155 142" stroke="#0866F5" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Left Leg straight on ground -->
    <path d="M 155 142 L 255 142" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Right Leg raised upward at 45 degrees -->
    <path d="M 155 142 L 235 60" stroke="#059669" stroke-width="18" stroke-linecap="round"/>
    <circle cx="235" cy="60" r="10" fill="#059669"/>
    
    <!-- Angle Arc showing degrees of lift -->
    <path d="M 205 142 A 50 50 0 0 0 198 102" fill="none" stroke="#0284C7" stroke-width="3.5" stroke-dasharray="4,4"/>
    <text x="212" y="118" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0284C7">45°</text>

    <!-- Upward Motion Arrow -->
    <path d="M 252 85 L 252 50" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <polygon points="246,54 252,42 258,54" fill="#EF4444"/>
  </g>

  <!-- Badge Pill -->
  <rect x="24" y="20" width="110" height="28" rx="14" fill="#FFFFFF" opacity="0.95"/>
  <text x="36" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#0284C7">LEG RAISE</text>
  <circle cx="122" cy="34" r="4" fill="#0284C7"/>
</svg>

