<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="balGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <filter id="shadowBal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7c3aed" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="260" rx="20" fill="url(#balGrad)"/>
  
  <circle cx="340" cy="50" r="45" fill="#DDD6FE" opacity="0.4"/>

  <!-- Character on Balance Wobble Board / Pad -->
  <g filter="url(#shadowBal)" transform="translate(130, 20)">
    <!-- Balance Board Base (curved rocker) -->
    <path d="M 30 205 Q 70 218 110 205" fill="none" stroke="#7C3AED" stroke-width="8" stroke-linecap="round"/>
    <rect x="25" y="196" width="90" height="10" rx="5" fill="#103463"/>
    
    <!-- Balance Fulcrum -->
    <polygon points="70,205 60,222 80,222" fill="#059669"/>

    <!-- Head with focus -->
    <circle cx="70" cy="38" r="19" fill="#103463"/>
    
    <!-- Torso upright and centered -->
    <path d="M 70 60 L 70 135" stroke="#0866F5" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Arms outstretched for equilibrium / balance -->
    <path d="M 15 80 Q 70 70 125 80" fill="none" stroke="#7C3AED" stroke-width="12" stroke-linecap="round"/>
    <circle cx="15" cy="80" r="6" fill="#7C3AED"/>
    <circle cx="125" cy="80" r="6" fill="#7C3AED"/>
    
    <!-- Left Leg supporting on board -->
    <path d="M 62 135 L 50 196" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
    <!-- Right Leg slightly lifted / tandem stance -->
    <path d="M 78 135 L 90 196" stroke="#334155" stroke-width="14" stroke-linecap="round"/>

    <!-- Equilibrium Alignment Axis (vertical dashed line) -->
    <line x1="70" y1="15" x2="70" y2="225" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
    <circle cx="70" cy="18" r="4" fill="#059669"/>
  </g>

  <!-- Badge Pill -->
  <rect x="24" y="20" width="150" height="28" rx="14" fill="#FFFFFF" opacity="0.95"/>
  <text x="36" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#7C3AED">BALANCE TRAINING</text>
  <circle cx="162" cy="34" r="4" fill="#7C3AED"/>
</svg>

