<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="waveBgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </radialGradient>

    <!-- Wave 1: Ocean Blue -->
    <linearGradient id="waveBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0866f5" />
    </linearGradient>

    <!-- Wave 2: Mint Teal -->
    <linearGradient id="waveMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Wave 3: Purple / Neuro Vitality -->
    <linearGradient id="wavePurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Spark Sun -->
    <linearGradient id="sunGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <filter id="shadow8" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0866f5" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Base Circular Badge -->
  <circle cx="250" cy="250" r="236" fill="url(#waveBgGlow)" stroke="#bfdbfe" stroke-width="4" filter="url(#shadow8)" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#dbeafe" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Wave 1: Lower Foundation Wave (Support & Strength) -->
  <path d="M 90 310
           C 150 370 230 380 290 340
           C 350 300 390 320 410 350
           C 390 390 320 420 250 420
           C 170 420 110 370 90 310 Z"
        fill="url(#waveBlueGrad)"
        opacity="0.9" />

  <!-- Wave 2: Dynamic Mid Wave (Active Rehabilitation & Motor Progress) -->
  <path d="M 85 240
           C 130 180 200 180 250 230
           C 290 270 340 280 390 240
           C 415 285 380 340 310 350
           C 240 360 170 320 120 270 Z"
        fill="url(#waveMintGrad)" />

  <!-- Wave 3: Upper Uplift Ribbon (Cognitive & Speech Flourish) -->
  <path d="M 140 180
           C 190 120 270 120 320 170
           C 360 210 400 210 425 190
           C 415 235 370 260 320 250
           C 260 240 210 180 140 180 Z"
        fill="url(#wavePurpleGrad)" />

  <!-- Center Rising Sun of Health / Recovery Starburst -->
  <circle cx="250" cy="115" r="32" fill="url(#sunGoldGrad)" filter="url(#shadow8)" />
  <circle cx="250" cy="115" r="14" fill="#ffffff" />

  <!-- Multi-Disciplinary Node Particles -->
  <circle cx="120" cy="140" r="10" fill="#0866f5" />
  <circle cx="380" cy="115" r="9" fill="#10b981" />
  <circle cx="430" cy="260" r="8" fill="#f59e0b" />
  <circle cx="75" cy="270" r="8" fill="#7c3aed" />

  <!-- Subtle Medical Pulse Heartbeat Curve -->
  <path d="M 170 380 L 210 380 L 225 355 L 245 400 L 265 365 L 280 380 L 320 380"
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>

