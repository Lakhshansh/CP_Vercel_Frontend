<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="gripGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <filter id="shadowGrip" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#d97706" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="260" rx="20" fill="url(#gripGrad)"/>
  
  <circle cx="340" cy="60" r="40" fill="#FDE68A" opacity="0.4"/>

  <!-- Hand Gripping Therapy Exerciser / Squeeze Ball -->
  <g filter="url(#shadowGrip)" transform="translate(130, 40)">
    <!-- Forearm -->
    <path d="M 15 155 L 65 95" stroke="#334155" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Palm base -->
    <circle cx="80" cy="85" r="28" fill="#103463"/>
    
    <!-- Therapy Resistance Ball / Ring being squeezed -->
    <ellipse cx="98" cy="78" rx="28" ry="24" fill="#059669"/>
    <ellipse cx="98" cy="78" rx="20" ry="16" fill="#10B981" opacity="0.7"/>

    <!-- Fingers gripping around the ball -->
    <!-- Thumb -->
    <path d="M 66 70 Q 75 52 90 58" fill="none" stroke="#0866F5" stroke-width="12" stroke-linecap="round"/>
    <!-- Index Finger -->
    <path d="M 94 56 Q 118 56 122 72" fill="none" stroke="#0866F5" stroke-width="10" stroke-linecap="round"/>
    <!-- Middle Finger -->
    <path d="M 98 68 Q 124 72 120 86" fill="none" stroke="#0866F5" stroke-width="10" stroke-linecap="round"/>
    <!-- Ring Finger -->
    <path d="M 95 82 Q 120 88 114 98" fill="none" stroke="#0866F5" stroke-width="10" stroke-linecap="round"/>
    <!-- Little Finger -->
    <path d="M 88 94 Q 110 102 104 110" fill="none" stroke="#0866F5" stroke-width="9" stroke-linecap="round"/>

    <!-- Compression Pressure Waves -->
    <path d="M 132 68 Q 140 78 132 88" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <path d="M 138 62 Q 148 78 138 94" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3"/>
  </g>

  <!-- Badge Pill -->
  <rect x="24" y="20" width="128" height="28" rx="14" fill="#FFFFFF" opacity="0.95"/>
  <text x="36" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#D97706">GRIP EXERCISE</text>
  <circle cx="140" cy="34" r="4" fill="#D97706"/>
</svg>

