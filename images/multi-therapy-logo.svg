<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <!-- Primary Blue Gradient -->
    <linearGradient id="mainBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0866f5" />
    </linearGradient>

    <!-- Emerald Teal Gradient -->
    <linearGradient id="mainTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <linearGradient id="mainCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Violet Hope Gradient -->
    <linearGradient id="mainVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="mainGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b3c73" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Left Circular Emblem (scaled to fit 140x140 at x=10, y=10) -->
  <g transform="translate(10, 10)">
    <!-- Base Circle -->
    <circle cx="70" cy="70" r="68" fill="#ffffff" stroke="#dbeafe" stroke-width="2.5" filter="url(#mainShadow)" />
    <circle cx="70" cy="70" r="63" fill="none" stroke="#f0f9ff" stroke-width="1.5" />

    <!-- Radiant Therapy Nodes (Speech, Physical, Occupational, Neuro) -->
    <!-- Node: Physical (Teal) -->
    <path d="M 64 38 C 58 27 42 30 40 43 C 39 54 50 60 61 55 Z" fill="url(#mainTealGrad)" opacity="0.9" />
    <circle cx="47" cy="40" r="3" fill="#ffffff" />

    <!-- Node: Neuro (Violet) -->
    <path d="M 76 38 C 82 27 98 30 100 43 C 101 54 90 60 79 55 Z" fill="url(#mainVioletGrad)" opacity="0.9" />
    <circle cx="93" cy="40" r="3" fill="#ffffff" />

    <!-- Node: Progress Star (Gold) -->
    <circle cx="70" cy="24" r="5.5" fill="url(#mainGoldGrad)" />

    <!-- Center Rising Patient Figure -->
    <circle cx="70" cy="50" r="8" fill="url(#mainBlueGrad)" />
    <path d="M 70 61 C 60 61 52 65 47 74 C 44 79 49 84 53 82 C 58 79 64 78 70 78 C 76 78 82 79 87 82 C 91 84 96 79 93 74 C 88 65 80 61 70 61 Z" fill="url(#mainBlueGrad)" />

    <!-- Interlocking Supportive Hands -->
    <path d="M 28 92 C 28 92 38 82 51 84 C 61 85 67 92 70 98 C 63 101 48 103 38 107 C 32 109 26 102 28 92 Z" fill="url(#mainCyanGrad)" opacity="0.95" />
    <path d="M 112 92 C 112 92 102 82 89 84 C 79 85 73 92 70 98 C 77 101 92 103 102 107 C 108 109 114 102 112 92 Z" fill="url(#mainTealGrad)" opacity="0.95" />

    <!-- Caring Base Arch -->
    <path d="M 34 104 C 47 119 59 123 70 123 C 81 123 93 119 106 104 C 98 116 84 126 70 126 C 56 126 42 116 34 104 Z" fill="url(#mainBlueGrad)" />

    <!-- Central Medical Cross Accent -->
    <circle cx="70" cy="94" r="5" fill="#ffffff" />
    <rect x="69" y="91.5" width="2" height="5" rx="0.5" fill="#0866f5" />
    <rect x="67.5" y="93" width="5" height="2" rx="0.5" fill="#0866f5" />
  </g>

  <!-- Typography: Multi Therapy -->
  <!-- "Multi" in Navy Dark -->
  <text x="168" y="76" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="800" fill="#103463" letter-spacing="-0.8">Multi</text>
  <!-- "Therapy" in Royal Healthcare Blue -->
  <text x="282" y="76" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="800" fill="#0866f5" letter-spacing="-0.8">Therapy</text>

  <!-- Tagline Badge Pill / Line -->
  <rect x="168" y="95" width="445" height="32" rx="16" fill="#f0f7ff" stroke="#bfdbfe" stroke-width="1" />
  
  <!-- Colored category dots in tagline -->
  <circle cx="186" cy="111" r="4" fill="#0866f5" />
  <text x="196" y="115" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" letter-spacing="0.5">CARE</text>

  <circle cx="260" cy="111" r="3" fill="#cbd5e1" />

  <circle cx="282" cy="111" r="4" fill="#10b981" />
  <text x="292" y="115" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46" letter-spacing="0.5">SUPPORT</text>

  <circle cx="376" cy="111" r="3" fill="#cbd5e1" />

  <circle cx="398" cy="111" r="4" fill="#f59e0b" />
  <text x="408" y="115" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e" letter-spacing="0.5">PROGRESS</text>

  <circle cx="496" cy="111" r="3" fill="#cbd5e1" />

  <circle cx="518" cy="111" r="4" fill="#8b5cf6" />
  <text x="528" y="115" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#5b21b6" letter-spacing="0.5">TOGETHER</text>
</svg>

