<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark/High-Tech Clinical Gradients -->
    <linearGradient id="hexBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <linearGradient id="techBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="cyanTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="deepNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0c4a6e" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Background -->
  <polygon points="250,25 445,138 445,362 250,475 55,362 55,138" 
           fill="url(#hexBgGrad)" 
           stroke="#bae6fd" 
           stroke-width="5" 
           filter="url(#shadow4)" />
  <polygon points="250,45 425,148 425,352 250,455 75,352 75,148" 
           fill="none" 
           stroke="#e0f2fe" 
           stroke-width="2" />

  <!-- Monogram 'M' and 'T' Integrated Structural Lines -->
  <!-- Letter 'T' Top Bar (Bridging Therapy Collaboration) -->
  <path d="M 140 160 L 360 160 C 372 160 380 170 380 180 C 380 190 372 200 360 200 L 140 200 C 128 200 120 190 120 180 C 120 170 128 160 140 160 Z"
        fill="url(#deepNavyGrad)" />

  <!-- Letter 'T' Center Spine (Vertical Pillar of Care) -->
  <path d="M 235 180 L 265 180 L 265 370 C 265 382 255 390 250 390 C 245 390 235 382 235 370 Z"
        fill="url(#deepNavyGrad)" />

  <!-- Left 'M' Wing (Ascending Blue Arc) -->
  <path d="M 140 370 
           L 140 210 
           C 140 210 175 270 210 320 
           L 210 370 
           C 210 370 185 330 165 300 
           L 165 370 Z" 
        fill="url(#techBlueGrad)" />

  <!-- Right 'M' Wing (Ascending Teal Arc) -->
  <path d="M 360 370 
           L 360 210 
           C 360 210 325 270 290 320 
           L 290 370 
           C 290 370 315 330 335 300 
           L 335 370 Z" 
        fill="url(#cyanTealGrad)" />

  <!-- Intersecting Center Chevron Apex (Multi-specialty integration) -->
  <polygon points="250,240 280,285 220,285" fill="#38bdf8" />

  <!-- 4 Clinical Therapy Connection Nodes -->
  <circle cx="140" cy="180" r="14" fill="#0284c7" />
  <circle cx="140" cy="180" r="6" fill="#ffffff" />

  <circle cx="360" cy="180" r="14" fill="#10b981" />
  <circle cx="360" cy="180" r="6" fill="#ffffff" />

  <circle cx="250" cy="115" r="16" fill="#2563eb" />
  <circle cx="250" cy="115" r="7" fill="#ffffff" />

  <circle cx="250" cy="385" r="14" fill="#0f172a" />
  <circle cx="250" cy="385" r="5" fill="#38bdf8" />
</svg>

