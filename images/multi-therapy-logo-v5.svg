<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="treeBgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#ffffff" />
    </radialGradient>

    <!-- Trunk / Trunk Hands Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3c73" />
      <stop offset="100%" stop-color="#0866f5" />
    </linearGradient>

    <!-- Branch Leaves Gradients -->
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="leafAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leafPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow5" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#065f46" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="250" cy="250" r="236" fill="url(#treeBgGlow)" stroke="#bbf7d0" stroke-width="4" filter="url(#shadow5)" />
  <circle cx="250" cy="250" r="224" fill="none" stroke="#dcfce7" stroke-width="2" stroke-dasharray="6,4" />

  <!-- The Therapy Tree Trunk formed by 2 Caring Supportive Hands / Rising Figure -->
  <!-- Left Trunk Hand -->
  <path d="M 210 405
           C 210 330 180 290 160 260
           C 145 235 155 210 180 220
           C 205 230 220 265 235 295
           C 240 305 245 320 250 340
           C 240 370 225 400 210 405 Z"
        fill="url(#trunkGrad)" />

  <!-- Right Trunk Hand -->
  <path d="M 290 405
           C 290 330 320 290 340 260
           C 355 235 345 210 320 220
           C 295 230 280 265 265 295
           C 260 305 255 320 250 340
           C 260 370 275 400 290 405 Z"
        fill="url(#trunkGrad)" />

  <!-- Center Human Figure Growing Upwards (Recovery) -->
  <circle cx="250" cy="180" r="20" fill="url(#trunkGrad)" />
  <path d="M 250 210 C 230 210 220 230 220 250 C 235 260 250 265 250 265 C 250 265 265 260 280 250 C 280 230 270 210 250 210 Z" fill="url(#trunkGrad)" />

  <!-- Multi-Disciplinary Therapy Leaves Canopy -->
  <!-- 1. Physical Therapy Leaf (Green - Left) -->
  <path d="M 175 190 C 120 180 110 130 145 105 C 185 80 215 130 175 190 Z" fill="url(#leafGreen)" />
  <circle cx="150" cy="130" r="7" fill="#ffffff" opacity="0.9" />

  <!-- 2. Speech & Language Leaf (Cyan - Center Left) -->
  <path d="M 220 145 C 195 90 220 60 250 65 C 270 70 265 110 220 145 Z" fill="url(#leafCyan)" />
  <circle cx="240" cy="85" r="6" fill="#ffffff" opacity="0.9" />

  <!-- 3. Occupational Therapy Leaf (Amber/Gold - Center Right) -->
  <path d="M 280 145 C 305 90 280 60 250 65 C 230 70 235 110 280 145 Z" fill="url(#leafAmber)" />
  <circle cx="265" cy="85" r="6" fill="#ffffff" opacity="0.9" />

  <!-- 4. Neuro & Sensory Leaf (Purple - Right) -->
  <path d="M 325 190 C 380 180 390 130 355 105 C 315 80 285 130 325 190 Z" fill="url(#leafPurple)" />
  <circle cx="350" cy="130" r="7" fill="#ffffff" opacity="0.9" />

  <!-- Small Flourishing Recovery Buds -->
  <circle cx="105" cy="180" r="10" fill="#34d399" />
  <circle cx="395" cy="180" r="10" fill="#c084fc" />
  <circle cx="250" cy="45" r="12" fill="#fbbf24" />

  <!-- Base Roots / Foundation -->
  <path d="M 180 405 C 215 418 285 418 320 405 C 300 422 200 422 180 405 Z" fill="#0b3c73" />
</svg>

