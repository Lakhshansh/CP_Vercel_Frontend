<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow2" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>

    <!-- Deep Royal Navy & Blue Gradient -->
    <linearGradient id="crossBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#0866f5" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Vibrant Mint & Emerald Leaf Gradient -->
    <linearGradient id="leafGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Glow Shadow -->
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Badge Background -->
  <rect x="25" y="25" width="450" height="450" rx="110" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" filter="url(#shadow2)" />
  <rect x="37" y="37" width="426" height="426" rx="98" fill="none" stroke="#f1f5f9" stroke-width="2" />

  <!-- Modern Geometric Cross Structure (Left Arm, Bottom Arm, Center) -->
  <!-- Left Arm of Cross -->
  <rect x="110" y="210" width="110" height="80" rx="22" fill="url(#crossBlueGrad)" />
  <!-- Bottom Arm of Cross -->
  <rect x="210" y="270" width="80" height="120" rx="22" fill="url(#crossBlueGrad)" />
  <!-- Top Arm of Cross (Slightly tapered) -->
  <rect x="210" y="110" width="80" height="110" rx="22" fill="url(#crossBlueGrad)" />

  <!-- Flourishing Vitality Leaf / Spiral (Intertwining the Right and Top Cross) -->
  <path d="M 250 250
           C 250 160 330 110 390 110
           C 400 170 360 270 290 320
           C 260 340 240 330 250 250 Z"
        fill="url(#leafGreenGrad)"
        filter="url(#glowGreen)" />

  <!-- Secondary Dynamic Sprout / Leaf -->
  <path d="M 290 220
           C 330 180 380 185 395 215
           C 370 260 320 270 290 220 Z"
        fill="#34d399"
        opacity="0.85" />

  <!-- Rehabilitation Pulse / Nerve Pathway Line -->
  <path d="M 140 250 
           L 190 250 
           L 210 215 
           L 235 285 
           L 255 235 
           L 270 250 
           L 320 250" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Vitality Energy Dots -->
  <circle cx="390" cy="110" r="10" fill="#10b981" />
  <circle cx="410" cy="140" r="6" fill="#38bdf8" />
  <circle cx="110" cy="250" r="7" fill="#2563eb" />
</svg>

