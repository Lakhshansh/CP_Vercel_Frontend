<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Shield Glow -->
    <radialGradient id="shieldBgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ffffff" />
    </radialGradient>

    <!-- Royal Medical Navy Gradient -->
    <linearGradient id="shieldNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b52" />
      <stop offset="50%" stop-color="#103463" />
      <stop offset="100%" stop-color="#0866f5" />
    </linearGradient>

    <!-- Vibrant Emerald & Teal Cross Gradient -->
    <linearGradient id="crossTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Golden Star of Care -->
    <linearGradient id="starGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f2b52" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Outer Protective Medical Shield -->
  <path d="M 250 35
           C 350 35 435 60 435 120
           C 435 250 365 375 250 455
           C 135 375 65 250 65 120
           C 65 60 150 35 250 35 Z"
        fill="url(#shieldBgGlow)"
        stroke="#cbd5e1"
        stroke-width="5"
        filter="url(#shadow7)" />

  <path d="M 250 55
           C 335 55 410 75 410 130
           C 410 240 345 350 250 425
           C 155 350 90 240 90 130
           C 90 75 165 55 250 55 Z"
        fill="none"
        stroke="#e2e8f0"
        stroke-width="2" />

  <!-- Bold Modern Clinical Cross Structure -->
  <!-- Vertical Beam -->
  <rect x="215" y="115" width="70" height="230" rx="20" fill="url(#shieldNavyGrad)" />
  <!-- Horizontal Beam -->
  <rect x="135" y="195" width="230" height="70" rx="20" fill="url(#shieldNavyGrad)" />

  <!-- Center Harmonizing Cross Emblem (Emerald/Teal Core) -->
  <rect x="225" y="145" width="50" height="170" rx="14" fill="url(#crossTealGrad)" />
  <rect x="165" y="205" width="170" height="50" rx="14" fill="url(#crossTealGrad)" />

  <!-- Center Care Heart / Progress Spark -->
  <circle cx="250" cy="230" r="24" fill="#ffffff" />
  <circle cx="250" cy="230" r="16" fill="url(#cyanArcGrad)" />
  
  <!-- 4 Radiant Multi-Therapy Star Points -->
  <circle cx="250" cy="85" r="12" fill="url(#starGoldGrad)" />
  <circle cx="250" cy="380" r="10" fill="#0284c7" />
  <circle cx="115" cy="230" r="10" fill="#10b981" />
  <circle cx="385" cy="230" r="10" fill="#8b5cf6" />
</svg>

