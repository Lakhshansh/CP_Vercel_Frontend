<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0866F5"/>
      <stop offset="100%" stop-color="#054cb8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0866F5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="260" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern / Tech accents -->
  <circle cx="340" cy="50" r="40" fill="#BFDBFE" opacity="0.4"/>
  <circle cx="60" cy="210" r="50" fill="#93C5FD" opacity="0.3"/>

  <!-- Motion Wave Indicator -->
  <path d="M 40 180 Q 200 120 360 170" fill="none" stroke="#60A5FA" stroke-width="3" stroke-dasharray="6,6" opacity="0.7"/>

  <!-- Character / Figure performing Arm Stretch -->
  <g filter="url(#shadow)" transform="translate(140, 25)">
    <!-- Head -->
    <circle cx="60" cy="40" r="22" fill="#103463"/>
    
    <!-- Torso -->
    <path d="M 46 68 C 46 64, 74 64, 74 68 L 78 145 C 78 150, 42 150, 42 145 Z" fill="#0866F5"/>
    
    <!-- Left Arm crossed horizontally across chest (stretched arm) -->
    <path d="M 46 75 Q 75 88 120 85" fill="none" stroke="#103463" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Right Arm holding and stretching left elbow -->
    <path d="M 74 82 L 88 108 L 86 78" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Lower Body / Base -->
    <path d="M 44 145 L 36 210 M 76 145 L 84 210" stroke="#334155" stroke-width="14" stroke-linecap="round"/>

    <!-- Stretch Tension Indicator Arrow -->
    <path d="M 115 70 Q 130 85 115 100" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="112,66 122,70 115,76" fill="#EF4444"/>
  </g>

  <!-- Badge Pill -->
  <rect x="24" y="20" width="120" height="28" rx="14" fill="#FFFFFF" opacity="0.95"/>
  <text x="36" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#0866F5">ARM STRETCH</text>
  <circle cx="132" cy="34" r="4" fill="#059669"/>
</svg>

