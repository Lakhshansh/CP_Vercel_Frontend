<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi Therapy Management System - Login</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <nav class="mt-navbar">
    <div class="container-fluid mt-navbar-inner">
      <a class="mt-brand" href="./index.html">
        <img src="./images/logo.png" alt="Multi Therapy Management System Logo" class="mt-logo">
        <div>
          <div class="mt-brand-title">Multi Therapy Management System</div>
          <div class="mt-brand-subtitle">Care • Support • Progress • Together</div>
        </div>
      </a>
    </div>
  </nav>

  <main class="container-fluid">
    <div class="login-card">
      <div class="logo-box">
        <img src="./images/logo.png" alt="Multi Therapy Management System Logo" class="login-logo">
      </div>
      <h2>Multi Therapy Management System</h2>
      <p class="text-muted">Online Administration Portal</p>

      <form id="loginForm">
        <input class="form-control mb-3" type="text" id="username"
               placeholder="Username" autocomplete="username" required>

        <div class="password-wrapper">
          <input id="loginPassword" class="form-control mb-3" type="password"
                 placeholder="Password" autocomplete="current-password" required>
          <button type="button" id="togglePassword" class="password-toggle"
                  aria-label="Show password">👁️</button>
        </div>

        <div class="captcha-section">
          <label class="captcha-label">🔐 Security Check</label>
          <div class="captcha-box">
            <div id="captchaText" class="captcha-image" aria-live="polite">Loading...</div>
            <button type="button" id="refreshCaptcha" class="captcha-refresh"
                    title="Refresh CAPTCHA">↻</button>
          </div>
          <input id="captchaInput" class="form-control mt-2" type="text"
                 placeholder="Enter CAPTCHA code" autocomplete="off"
                 maxlength="5" required>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="remember" checked>
            <span>Remember Me</span>
          </label>
          <a href="./forgot.html" id="forgotLink" class="forgot-password">Forgot Password?</a>
        </div>

        <div id="loginMessage" class="alert" hidden></div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <a href="./signup.html" class="btn btn-outline-success w-100 mt-2">Sign Up</a>
    </div>
  </main>
  <script src="./js/api.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
