<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - Multi Therapy Management System</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .step-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      background: #e7f1ff;
      color: #0d6efd;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .demo-otp-banner {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <main class="container-fluid">
    <div class="login-card">
      <div class="logo-box">
        <img src="./images/logo.png" alt="Multi Therapy Management System Logo" class="login-logo">
      </div>
      <h2>Reset Password</h2>
      <p class="text-muted">Account Recovery Portal</p>

      <div id="forgotMessage" class="alert mb-3" hidden></div>

      <!-- STEP 1: Enter Username or Email -->
      <form id="step1Form">
        <div class="text-center">
          <span class="step-badge">Step 1 of 3: Verification</span>
        </div>
        <p style="font-size: 14px; color: #64748b; text-align: center; margin-bottom: 14px;">
          Enter your registered username or email address to receive a secure recovery code.
        </p>
        <input class="form-control mb-3" type="text" id="identifier"
               placeholder="Username or Registered Email" required autocomplete="username">
        <button type="submit" id="btnSendOtp" class="btn btn-primary w-100">Send Recovery Code</button>
      </form>

      <!-- STEP 2: Enter 6-digit OTP -->
      <form id="step2Form" hidden>
        <div class="text-center">
          <span class="step-badge">Step 2 of 3: Enter Code</span>
        </div>
        <div id="demoOtpBox" class="demo-otp-banner" hidden></div>
        <p style="font-size: 14px; color: #64748b; text-align: center; margin-bottom: 14px;">
          Enter the 6-digit verification code sent to your registered email.
        </p>
        <input class="form-control mb-3" type="text" id="otpInput"
               placeholder="Enter 6-digit Code" maxlength="6" inputmode="numeric"
               pattern="[0-9]{6}" required autocomplete="one-time-code">
        <button type="submit" id="btnVerifyOtp" class="btn btn-primary w-100">Verify Code</button>
        <button type="button" id="btnResend" class="btn btn-outline-primary w-100 mt-2" style="font-size: 14px; min-height: 40px;">
          Resend Code
        </button>
      </form>

      <!-- STEP 3: Set New Password -->
      <form id="step3Form" hidden>
        <div class="text-center">
          <span class="step-badge">Step 3 of 3: New Password</span>
        </div>
        <div class="password-wrapper">
          <input class="form-control mb-3" type="password" id="newPassword"
                 placeholder="New Password (min. 6 characters)" required autocomplete="new-password">
        </div>
        <div class="password-wrapper">
          <input class="form-control mb-3" type="password" id="confirmPassword"
                 placeholder="Confirm New Password" required autocomplete="new-password">
        </div>
        <button type="submit" id="btnResetPassword" class="btn btn-primary w-100">Update Password</button>
      </form>

      <a href="./index.html" class="btn btn-outline-success w-100 mt-3">Back to Login</a>
    </div>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/forgot.js"></script>
</body>
</html>
