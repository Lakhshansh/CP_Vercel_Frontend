<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="./images/multi_therapy_logo_100x100.png" type="image/png">
  <meta charset="UTF-8">
  <title>Redirecting to Profile | Every Individual Deserves Better Care.</title>
  <script>
    (function() {
      try {
        var rawUser = localStorage.getItem("currentUser");
        if (rawUser) {
          var user = JSON.parse(rawUser);
          var role = (user && user.role) ? user.role.toLowerCase() : "";
          if (role.indexOf("doctor") !== -1 || role.indexOf("therapist") !== -1) {
            window.location.replace("./doctor-profile.html");
            return;
          }
        }
      } catch (e) {}
      window.location.replace("./patient-profile.html");
    })();
  </script>
  <link rel="stylesheet" href="./css/clinical-dropdown.css">
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #334155;">
  <p>Loading Multi Therapy Profile...</p>
  <script src="./js/clinical-dropdown.js"></script>
</body>
</html>
